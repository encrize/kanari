<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Japanese Kana Watermarks -->
  <text x="1050" y="240" font-family="'Noto Sans JP', -apple-system, sans-serif" font-size="280" font-weight="900" fill="#ffffff" opacity="0.025" text-anchor="middle">カ</text>
  <text x="150" y="550" font-family="'Noto Sans JP', -apple-system, sans-serif" font-size="240" font-weight="900" fill="#ffffff" opacity="0.02" text-anchor="middle">あ</text>

  <!-- Main Card Container -->
  <g filter="url(#shadow)">
    <rect x="70" y="65" width="1060" height="500" rx="28" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Card Content -->
  <!-- Header: Brand + 100% FREE -->
  <g transform="translate(130, 140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">kanari</text>
    <text x="940" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#10b981" letter-spacing="1.5" text-anchor="end">100% FREE</text>
  </g>

  <!-- Headline: Japanese kana, made simple. -->
  <g transform="translate(130, 225)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Japanese kana, made simple.</text>
  </g>

  <!-- Description -->
  <g transform="translate(130, 280)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.3">
      Learn Hiragana and Katakana through interactive practice, smart repetition
    </text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.3">
      and real-world vocabulary.
    </text>
  </g>

  <!-- Feature Pill Badges -->
  <g transform="translate(130, 380)">
    <!-- Pill 1: No subscriptions -->
    <rect x="0" y="0" width="195" height="42" rx="21" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    <text x="97" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">No subscriptions</text>

    <!-- Pill 2: No ads -->
    <rect x="215" y="0" width="115" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="272" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="middle">No ads</text>

    <!-- Pill 3: Open access -->
    <rect x="350" y="0" width="155" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="427" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="middle">Open access</text>
  </g>

  <!-- Divider Line -->
  <line x1="130" y1="465" x2="1070" y2="465" stroke="#1e293b" stroke-width="1.5" />

  <!-- Footer Navigation Tags -->
  <g transform="translate(130, 508)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#64748b" letter-spacing="3">HIRAGANA  ·  KATAKANA  ·  WORDS  ·  PRACTICE</text>
  </g>
</svg>
